# ---------------------------------------------------------------------------
# Kein Build auf Netlify — es wird ausschließlich das fertige dist/ ausgeliefert,
# auch bei den automatischen Deploys über die GitHub-Anbindung (Repo:
# github.com/timoguenthner90-maker/Social-Media_T.Jocksch, verbunden per
# Continuous Deployment auf main).
#
# Hintergrund: Der Build in Netlifys eigener Umgebung brach über vierzehn
# Deploys hinweg reproduzierbar mit "exit code 2" ab, während derselbe Stand
# lokal fehlerfrei durchlief — geprüft aus einem frischen Clone, mit Node 22
# und 24, mit und ohne devDependencies. Die Ursache ließ sich nicht auf eine
# Quelldatei eingrenzen; die Build-Logs waren ohne Netlify-Login nicht lesbar.
#
# Das committete dist/ umgeht das Problem vollständig: Netlify hat nichts mehr
# zu bauen, egal ob der Deploy manuell per CLI oder automatisch durch einen
# GitHub-Push ausgelöst wird. Für dieses Projekt — eine statische Seite, eine
# Autorin — ist das ohnehin die verlässlichere Variante: Der Abnahme-Gauntlet
# (npm run build && astro check && npm run verify) läuft vor jedem Push lokal;
# ausgeliefert wird exakt das geprüfte Ergebnis.
#
# Zurück auf einen Netlify-Build: command = "npm run build" setzen, dist/ wieder
# in .gitignore aufnehmen und aus dem Index entfernen.
# ---------------------------------------------------------------------------

[build]
  command = ""
  publish = "dist"

# ---------------------------------------------------------------------------
# Security-Header.
#
# Die CSP ist eng gefasst, weil die Seite keine externen Ressourcen lädt:
# Schriften kommen aus dem eigenen Build, Bilder und Videos aus /img und /video,
# es gibt kein Tracking und keine eingebetteten Drittinhalte.
#
# Zwei Abweichungen von der strengsten Fassung:
#   form-action 'self'  — Netlify Forms nimmt den POST auf derselben Origin
#                         entgegen. Mit 'none' würde der Browser den Versand
#                         blockieren und das Kontaktformular wäre tot.
#   media-src  'self'   — für die Reels auf /portfolio/.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self'; connect-src 'none'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# Bilder und Videos tragen keinen Hash im Namen, werden aber praktisch nie
# einzeln ausgetauscht — bei einer Änderung bekommt die Datei einen neuen Namen.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
