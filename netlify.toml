# ---------------------------------------------------------------------------
# Kein Build auf Netlify — es wird ausschließlich das fertige dist/ ausgeliefert.
#
# Hintergrund: Der Build in Netlifys Umgebung bricht seit der Straffung mit
# "exit code 2" ab, während derselbe Stand lokal fehlerfrei durchläuft — geprüft
# aus einem frischen Clone, mit Node 22 und 24, mit und ohne devDependencies.
# Eine Deploy-Bisektion über vierzehn Durchläufe hat die Ursache nicht auf eine
# Quelldatei festnageln können; die Build-Logs sind ohne Netlify-Login nicht
# lesbar. Solange das offen ist, ist der lokale Build die verlässlichere Quelle.
#
# Das passt zu diesem Projekt: eine statische Seite, eine Autorin, und ein
# Abnahme-Gauntlet (npm run build && astro check && npm run verify), der vor
# jedem Deploy ohnehin lokal läuft. dist/ ist deshalb eingecheckt.
#
# Zurück auf einen Netlify-Build: command = "npm run build" setzen, dist/ wieder
# in .gitignore aufnehmen und aus dem Index entfernen.
# ---------------------------------------------------------------------------

[build]
  command = ""
  publish = "dist"

# ---------------------------------------------------------------------------
# Security-Header.
#
# Die CSP ist eng gefasst, weil die Seite keine externen Ressourcen lädt:
# Schriften kommen aus dem eigenen Build, Bilder und Videos aus /img und /video,
# es gibt kein Tracking und keine eingebetteten Drittinhalte.
#
# Zwei Abweichungen von der strengsten Fassung:
#   form-action 'self'  — Netlify Forms nimmt den POST auf derselben Origin
#                         entgegen. Mit 'none' würde der Browser den Versand
#                         blockieren und das Kontaktformular wäre tot.
#   media-src  'self'   — für die Reels auf /portfolio/.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self'; connect-src 'none'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# Bilder und Videos tragen keinen Hash im Namen, werden aber praktisch nie
# einzeln ausgetauscht — bei einer Änderung bekommt die Datei einen neuen Namen.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
